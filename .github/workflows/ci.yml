name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Eterna.slnx

      - name: Build
        run: dotnet build Eterna.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Eterna.slnx --no-build --configuration Release --verbosity minimal

      - name: Publish
        run: dotnet publish src/Eterna.Web/Eterna.Web.csproj --configuration Release -o artifacts/web

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: eterna-web
          path: artifacts/web
          if-no-files-found: error
