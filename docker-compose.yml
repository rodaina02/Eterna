services:
  postgres:
    image: postgres:16-alpine
    container_name: eterna-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eterna
    ports:
      - "5432:5432"
    volumes:
      - eterna_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eterna"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eterna_pg:
